<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lightsaber Deals</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
</head>
<body>
    <header>
        <h1>Current Lightsaber Deals</h1>
        <nav>
            <a href="{{ url_for('price_history') }}" class="nav-button">View Price History</a>
        </nav>
    </header>
    <main>
        {% if deals %}
            <ul>
                {% for deal in deals %}
                    <li>
                        <h2>{{ deal.title }}</h2>
                        <img src="{{ deal.image_url }}" alt="{{ deal.title }}">
                        <p>{{ deal.description }}</p>
                        <p>Price: {{ deal.price }}</p>
                    </li>
                {% endfor %}
            </ul>
        {% else %}
            <p>No current deals available.</p>
        {% endif %}
    </main>
    <footer>
        <p>{{ current_year }} Lightsaber Deals</p>
    </footer>
    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
