<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lightsaber Deals</title>
    <link rel="stylesheet" href="src/web/static/css/styles.css">
</head>
<body>
    <header>
        <h1>Current Lightsaber Deals</h1>
        <nav>
            <a href="price-history.html" class="nav-button">View Price History</a>
        </nav>
    </header>
    <main>
        <div id="deals-container" class="deals-grid">
            <p class="loading">Loading deals...</p>
        </div>
    </main>
    <footer>
        <p id="current-year"></p>
    </footer>

    <script>
        async function loadDeals() {
            try {
                let data;
                console.log('Attempting to load deals...');
                
                try {
                    const apiResponse = await fetch('/api/deals');
                    if (apiResponse.ok) {
                        data = await apiResponse.json();
                        console.log('Loaded data from API:', data);
                    }
                } catch (e) {
                    console.log('API fetch failed, trying static file...');
                    const staticResponse = await fetch('data/price_history.json');
                    if (!staticResponse.ok) {
                        throw new Error(`Failed to load static data: ${staticResponse.status}`);
                    }
                    data = await staticResponse.json();
                    console.log('Loaded static data:', data);
                }

                const dealsContainer = document.getElementById('deals-container');
                
                if (!data || !data.products || data.products.length === 0) {
                    console.log('No data found:', data);
                    dealsContainer.innerHTML = '<p>No deals available</p>';
                    return;
                }

                dealsContainer.innerHTML = data.products.map(product => `
                    <div class="deal-card">
                        <img src="${product.image_url}" alt="${product.name}">
                        <h2>${product.name}</h2>
                        <p class="price">$${product.price}</p>
                        <a href="${product.url}" class="btn" target="_blank">View Deal</a>
                    </div>
                `).join('');
                console.log(`Rendered ${data.products.length} products`);
            } catch (error) {
                console.error('Error loading deals:', error);
                document.getElementById('deals-container').innerHTML = 
                    '<p class="error">Error loading deals. Please try again later.</p>';
            }
        }

        document.getElementById('current-year').textContent = 
            `${new Date().getFullYear()} Lightsaber Deals`;
        document.addEventListener('DOMContentLoaded', loadDeals);
    </script>
</body>
</html>
