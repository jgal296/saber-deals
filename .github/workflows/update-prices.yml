name: Update Price History

on:
  schedule:
    - cron: '0 17 * * *'  # Run daily at midnight
  workflow_dispatch:      # Allow manual triggers

jobs:
  update-prices:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        
    - name: Run scraper and export data
      run: |
        python src/scraper/disney_scraper.py
        python src/utils/export_data.py
        
    - name: Commit and push if changes
      run: |
        git config --local user.email "github-actions[bot]@users.noreply.github.com"
        git config --local user.name "github-actions[bot]"
        git checkout gh-pages
        git add data/
        git add src/web/static/data/
        git commit -m "Update price history data [skip ci]" || exit 0
        git push origin gh-pages