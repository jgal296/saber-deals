name: Update Price History

on:
  schedule:
    - cron: '0 17 * * *'  # 12:00 PM EST
  workflow_dispatch:

jobs:
  update-prices:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
      with:
        ref: gh-pages
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        
    - name: Run scraper and export data
      run: |
        python -m src.scraper.disney_scraper
        python -m src.utils.export_data
        
    - name: Commit and push if changes
      run: |
        git config --local user.email "github-actions[bot]@users.noreply.github.com"
        git config --local user.name "github-actions[bot]"
        git add data/price_history.json
        git add src/web/static/data/
        git commit -m "Update price history data [skip ci]" || exit 0
        git push